# Lance les tests à chaque envoi sur GitHub (onglet Actions) : fusion entre appareils,
# service worker et limites des recommandations
name: Tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.js
      - run: npm ci && node --test test-quota.js
        working-directory: functions
